
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   

    <!-- bootstrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
/>

<title>Task Manager</title>
</head>
<body>
    <h1>Task Management</h1>

    <div class="container">
       <div class="form-row">
        <div class="form-group col-md-6">
          <!-- <label for="inputEmail14">Task Name</label> -->
          <input type="text" class="form-control" id="newTaskName" placeholder="Add task name here">
        </div>
        <hr>
        <div class="form-group col-md-6">
          <!-- <label for="inputPassword4">Discription</label> -->
          <input type="text" class="form-control" id="discription" placeholder="discription of task">
        </div>
       </div>

       <div class="form-row">
        <div class="form-group col-md-6">
        <label for="inputState"></label>
        <select id="taskStatus" class="form-control">
          <option selected value="running">Running.</option>
          <option value="completed">Completed</option>
          <option value="finished">Finished</option>
        </select>
        </div>
        <div class="form-group col-md-6 justify-content-end">
          <button onclick="addNewTask()" class="btn btn-primary">Add New Task</button>
        </div>
       </div>

    </div>

    <hr>

    <div class="container">
        <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Task NAme</th>
            <th scope="col">Discription</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody id="taskList"></tbody>
        
         </table>
    </div>

      




<script src="./task.js"></script>
    <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"
></script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
    integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
    crossorigin="anonymous"
></script>
    
</body>
</html>
